services:
  api1:
    build: .
    env_file: [.env]
    depends_on: [postgres, redis-sentinel-1, redis-sentinel-2, redis-sentinel-3]
    networks: [app-net]

  api2:
    build: .
    env_file: [.env]
    depends_on: [postgres, redis-sentinel-1, redis-sentinel-2, redis-sentinel-3]
    networks: [app-net]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [api1, api2]
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [app-net]

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=appdb
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    networks: [app-net]

  redis-master:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "redispass"]
    ports: ["6379:6379"]
    networks: [app-net]

  redis-replica-1:
    image: redis:7-alpine
    command:
      ["redis-server", "--replicaof", "redis-master", "6379", "--requirepass", "redispass", "--masterauth", "redispass"]
    depends_on: [redis-master]
    networks: [app-net]

  redis-replica-2:
    image: redis:7-alpine
    command:
      ["redis-server", "--replicaof", "redis-master", "6379", "--requirepass", "redispass", "--masterauth", "redispass"]
    depends_on: [redis-master]
    networks: [app-net]

  redis-sentinel-1:
    image: bitnami/redis-sentinel:latest
    environment:
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_MASTER_NAME=mymaster
      - REDIS_SENTINEL_MASTER_HOST=redis-master
      - REDIS_SENTINEL_MASTER_PORT_NUMBER=6379
      - REDIS_SENTINEL_PASSWORD=redispass
    ports: ["26379:26379"]
    depends_on: [redis-master, redis-replica-1, redis-replica-2]
    networks: [app-net]

  redis-sentinel-2:
    image: bitnami/redis-sentinel:latest
    environment:
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_MASTER_NAME=mymaster
      - REDIS_SENTINEL_MASTER_HOST=redis-master
      - REDIS_SENTINEL_MASTER_PORT_NUMBER=6379
      - REDIS_SENTINEL_PASSWORD=redispass
    depends_on: [redis-master]
    networks: [app-net]

  redis-sentinel-3:
    image: bitnami/redis-sentinel:latest
    environment:
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_MASTER_NAME=mymaster
      - REDIS_SENTINEL_MASTER_HOST=redis-master
      - REDIS_SENTINEL_MASTER_PORT_NUMBER=6379
      - REDIS_SENTINEL_PASSWORD=redispass
    depends_on: [redis-master]
    networks: [app-net]

  # -------------------------
  # ✅ JENKINS
  # -------------------------
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [app-net]

networks:
  app-net: {}

volumes:
  pg_data: {}
  jenkins_home: {}
